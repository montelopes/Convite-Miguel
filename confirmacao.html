<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.json">
  <title>Confirmar Presença | 1º Aninho do Miguel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel+Decorative:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Great+Vibes&family=Jost:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./confirmacao.css" />
</head>
<body>
  <div class="page-confirm">
    <header class="hero">
      <div class="hero-glow"></div>
      <div class="corner corner-tl"></div>
      <div class="corner corner-tr"></div>

      <div class="hero-content">
        <p class="hero-blessing">1º aniversário</p>
        <div class="hero-divider">
          <span></span>
          <span class="hd-dot"></span>
          <span class="hd-diamond">◆</span>
          <span class="hd-dot"></span>
          <span></span>
        </div>
        <h2 class="hero-names">Miguel</h2>
      </div>
    </header>

    <main class="form-section">
      <div class="form-header">
        <a class="back-link" href="./index.html">← Voltar ao convite</a>
        <h1>Confirmar Presença</h1>
        <p class="deadline-banner">Confirmação até o dia 23 de outubro</p>
      </div>

      <form id="rsvp-form" novalidate class="confirm-form">
        <div class="field">
          <label for="guest-name">Nome completo</label>
          <input id="guest-name" name="guestName" type="text" required maxlength="80" placeholder="Seu nome completo" />
        </div>
        <div class="field">
          <label for="guest-phone">Telefone (WhatsApp)</label>
          <input id="guest-phone" name="guestPhone" type="tel" inputmode="tel" required maxlength="20" placeholder="(61) 99999-9999" />
        </div>
        <div class="field">
          <label for="guest-count">Total de pessoas (incluindo você)</label>
          <div class="number-input">
            <button type="button" class="num-btn" id="decreaseBtn">−</button>
            <input id="guest-count" name="guestCount" type="number" min="1" max="10" value="1" required readonly />
            <button type="button" class="num-btn" id="increaseBtn">+</button>
          </div>
        </div>
        <div class="field">
          <label>Você poderá comparecer?</label>
          <div class="radio-group">
            <label class="radio-card selected" id="yesCard">
              <input type="radio" name="attendance" value="Sim" required checked />
              <span class="radio-icon">✓</span>
              <span>Sim, confirmo presença</span>
            </label>
            <label class="radio-card" id="noCard">
              <input type="radio" name="attendance" value="Não" required />
              <span class="radio-icon">✗</span>
              <span>Não poderei ir</span>
            </label>
          </div>
        </div>
        <div class="field">
          <label for="guest-note">Observações <span class="optional">(opcional)</span></label>
          <textarea id="guest-note" name="guestNote" rows="3" maxlength="180" placeholder="Alguma restrição alimentar ou recado especial..."></textarea>
        </div>
        <button type="submit" class="btn-submit">
          <span>Enviar pelo WhatsApp</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
          </svg>
        </button>
        <p id="form-feedback" class="feedback" aria-live="polite"></p>
      </form>
    </div>
  </div>

  <audio id="bg-audio" preload="auto" loop>
  <source src="./audio/Agorasim.mp3" type="audio/mpeg">
</audio>

  <script src="./confirmacao.js"></script>
</body>
</html>
